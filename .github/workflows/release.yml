name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --noconsole --name ChatGPT-Auto-Continue --collect-submodules comtypes tray_app.py

      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChatGPT-Auto-Continue.exe
          generate_release_notes: true
